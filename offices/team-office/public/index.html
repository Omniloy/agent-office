<style>
:root {
  --bg: #0c0e16; --glass: rgba(18, 21, 31, .95); --panel: #12151f; --on-accent: #0b1020; --bar: 44px; --r-s: 6px; --shadow: 0 6px 22px rgba(0, 0, 0, .3); --glass-2: rgba(255, 255, 255, .05);
  --line: rgba(255, 255, 255, .09); --text: #eceff7; --muted: #98a2b8; --dim: #6b7489;

}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
#scene, #labels { position: fixed; inset: 0; }
#labels { pointer-events: none; }
.glass { background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }

/* top bar */
.top { position: fixed; top: 0; left: 0; right: 0; height: var(--bar); display: flex; align-items: center; gap: 20px; padding: 0 10px 0 12px; background: var(--glass); border-bottom: 1px solid var(--line); z-index: 7; white-space: nowrap; }
.brand { display: flex; align-items: center; gap: 9px; flex: none; }
.brand .logo { width: 22px; height: 22px; border-radius: 6px; background: #fff url(/logo.svg) center / 72% no-repeat; color: transparent; display: grid; place-items: center; font-weight: 800; font-size: 12px; }
.brand b { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.brand small { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.live { width: 7px; height: 7px; border-radius: 50%; background: var(--offline); flex: none; }
.live.on { background: var(--working); }
.stats { flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; gap: 0 18px; height: 20px; overflow: hidden; }
.stat { display: flex; align-items: center; gap: 6px; height: 20px; color: var(--muted); font-size: 12.5px; flex: none; }
.stat b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none; }
[data-status=working] .dot, .dot.working { background: var(--working); }
[data-status=blocked] .dot, .dot.blocked { background: var(--needs); }
[data-status=offline] .dot, .dot.offline { background: var(--offline); }
[data-status=talking] .dot, .dot.talking { background: var(--talking); }
.tools { display: flex; gap: 2px; flex: none; margin-left: auto; position: relative; }

.tools button:hover { color: var(--text); background: var(--glass-2); }
.tools > button.on { color: var(--text); background: rgba(255, 255, 255, .1); }
.menu { position: absolute; top: calc(100% + 9px); right: 0; min-width: 200px; padding: 4px; display: none; flex-direction: column; }
.menu.open { display: flex; }
.menu button { display: flex; justify-content: space-between; gap: 18px; text-align: left; padding: 7px 10px; color: var(--text); }
#btn-feed::after { content: "Hidden"; color: var(--dim); }

/* roster */
#roster { position: fixed; top: calc(var(--bar) + 12px); left: 12px; width: 256px; display: flex; flex-direction: column; z-index: 4; background: var(--glass); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
#roster .card { position: relative; text-align: left; width: 100%; border: 0; border-radius: 0; background: transparent; box-shadow: none; padding: 9px 26px 9px 12px; display: grid; grid-template-columns: 30px 1fr; gap: 1px 10px; align-items: center; }

.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--c); display: grid; place-items: center; font-weight: 700; font-size: 11.5px; color: #fff; grid-row: span 2; position: relative; }
.avatar::after { content: ""; position: absolute; right: -2px; bottom: -2px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--panel); background: var(--s, var(--idle)); }
.card .who { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.card .who b { font-size: 13px; font-weight: 600; white-space: nowrap; }
.card .who span { color: var(--dim); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .line { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .last { grid-column: 2; color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .line em { font-style: normal; color: var(--s, var(--idle)); font-weight: 600; }
.card kbd { position: absolute; right: 10px; top: 9px; font: 10px var(--mono); color: var(--dim); }

/* the person panel takes more room on a wide window, and its left edge drags */
:root { --panel-w: clamp(410px, 40vw, 680px); }
#panel-grip { position: absolute; left: 0; top: 0; bottom: 0; width: 9px; cursor: ew-resize; z-index: 3; }
#panel-grip::after { content: ""; position: absolute; left: 3px; top: 50%; width: 3px; height: 44px; margin-top: -22px; border-radius: 3px; background: rgba(255, 255, 255, .16); transition: background .15s, height .15s, margin .15s; }
#panel-grip:hover::after, body.resizing #panel-grip::after { background: var(--accent); height: 80px; margin-top: -40px; }
body.resizing { user-select: none; cursor: ew-resize; } body.resizing #panel { transition: none; }
pre.term { font-size: 11.5px; }
/* pull requests on a person */
.pr { display: grid; grid-template-columns: auto 1fr; gap: 2px 9px; padding: 8px 10px; border-radius: 10px; background: var(--glass-2); text-decoration: none; color: inherit; }
.pr:hover { background: rgba(255, 255, 255, .09); }
.pr b { font: 600 12px var(--mono); color: var(--muted); }
.pr span { grid-column: 1 / -1; font-size: 12.5px; }
.prs { font-style: normal; justify-self: end; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: rgba(251, 191, 36, .16); color: #fbbf24; white-space: nowrap; }
.prs.approved { background: rgba(34, 197, 94, .18); color: #4ade80; } .prs.changes, .prs.failing { background: rgba(248, 113, 113, .18); color: #f87171; } .prs.draft { background: rgba(255, 255, 255, .1); color: var(--muted); }
.card .who .prn { margin-left: auto; flex: none; font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 99px; background: rgba(251, 191, 36, .16); color: #fbbf24; overflow: visible; }
.card .who .prn.ok { background: rgba(34, 197, 94, .18); color: #4ade80; } .card .who .prn.bad { background: rgba(248, 113, 113, .18); color: #f87171; }
/* which traceability matrix the whiteboard shows */
#trace-pick { position: fixed; left: 50%; top: calc(var(--bar) + 14px); transform: translateX(-50%); display: none; align-items: center; gap: 6px; padding: 6px 8px; z-index: 7; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); font-size: 12.5px; max-width: calc(100vw - 24px); flex-wrap: wrap; }
#trace-pick.show { display: flex; }
#trace-pick span { color: var(--dim); padding: 0 4px; }
#trace-pick button, #trace-pick a { border: 1px solid transparent; background: transparent; color: var(--muted); border-radius: var(--r-s); padding: 4px 10px; font: inherit; cursor: pointer; text-decoration: none; }
#trace-pick button:hover, #trace-pick a:hover { color: var(--text); background: var(--glass-2); }
#trace-pick button.on { color: var(--text); border-color: var(--accent); background: rgba(255, 255, 255, .07); }
#trace-pick button small { color: var(--dim); margin-left: 5px; }
body.embed #trace-pick { display: none !important; }

/* big teams */
#roster { max-height: calc(100vh - var(--bar) - 84px); overflow-y: auto; }
#roster.many .card { padding: 5px 26px 5px 10px; grid-template-columns: 24px 1fr; gap: 0 9px; }
#roster.many .avatar { width: 24px; height: 24px; font-size: 10px; }
#roster.many .card kbd { top: 6px; }
.crowded .tag:not(.hot) .chip span { display: none; }
.crowded .tag:not(.hot) .chip { padding: 2px 8px 2px 7px; font-size: 11.5px; }

/* feed */
#feed { position: fixed; left: 12px; bottom: 12px; width: 370px; max-height: 40vh; display: flex; flex-direction: column; z-index: 4; }
#feed.hidden { display: none; }
#feed h3, .sec h3 { margin: 0; font-size: 12px; color: var(--muted); font-weight: 600; }
#feed h3 { padding: 11px 14px 6px; }
#feed ol { list-style: none; margin: 0; padding: 0 8px 8px; overflow: auto; display: flex; flex-direction: column; gap: 2px; }
#feed li { padding: 6px 8px; border-radius: 9px; font-size: 12.5px; color: var(--muted); display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
#feed li b { color: var(--text); font-weight: 600; }
#feed li time { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
#feed li.msg { display: block; padding: 9px 10px; background: var(--glass-2); border: 1px solid transparent; cursor: pointer; }
#feed li.msg:hover { border-color: var(--line); }
#feed .fhead { display: flex; align-items: center; gap: 6px; }
#feed .fhead span { color: var(--dim); }
#feed .fhead time { margin-left: auto; }
.mini { width: 20px; height: 20px; border-radius: 7px; background: var(--c); color: #fff; font: 700 9px var(--sans); display: inline-grid; place-items: center; font-style: normal; flex: none; }
#feed .ftext { margin-top: 6px; color: #dfe4ef; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
#feed li.msg.open .ftext { display: block; }
a { color: #9db4ff; text-decoration: none; }
a:hover { text-decoration: underline; }
a.key { font: 600 .9em var(--mono); background: rgba(124, 156, 255, .16); padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
.tag .bubble { pointer-events: auto; }
.tag .bubble a { color: #2447c9; text-decoration: underline; }
.tag .bubble a.key { background: rgba(36, 71, 201, .12); text-decoration: none; }
.tag .bubble.you a { color: #fff; }
#feed li.new { animation: flash 1.6s ease-out; }
@keyframes flash { from { background: rgba(124, 156, 255, .22); } to { background: transparent; } }
#feed .empty { padding: 4px 8px 10px; color: var(--dim); font-size: 12.5px; }

/* detail panel */
#panel { position: fixed; top: calc(var(--bar) + 12px); right: 12px; bottom: 12px; width: var(--panel-w); display: flex; flex-direction: column; z-index: 6; transform: translateX(calc(100% + 30px)); transition: transform .32s cubic-bezier(.2, .8, .2, 1); overflow: hidden; }
#panel.open { transform: none; }
.phead { padding: 16px 16px 12px; display: grid; grid-template-columns: 46px 1fr auto; gap: 12px; align-items: center; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, color-mix(in srgb, var(--c) 22%, transparent), transparent); }
.phead .avatar { width: 46px; height: 46px; border-radius: 50%; font-size: 16px; grid-row: auto; }
.phead h2 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
.phead p { margin: 1px 0 0; color: var(--muted); font-size: 12.5px; }
.x { border: 0; background: var(--glass-2); width: 30px; height: 30px; border-radius: 9px; color: var(--muted); font-size: 15px; }
.x:hover { color: var(--text); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; background: var(--glass-2); font-size: 11.5px; font-weight: 600; color: var(--s, var(--idle)); }
.tabs { display: flex; gap: 2px; padding: 8px 10px 0; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 11px; color: var(--muted); border-bottom: 2px solid transparent; font-size: 13px; font-weight: 500; }
.tabs button.on { color: var(--text); border-color: var(--c); }
.pbody { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px; }
.sec h3 { margin-bottom: 7px; }
.now { padding: 11px 13px; border-radius: 12px; background: var(--glass-2); border-left: 3px solid var(--s, var(--idle)); }
.now small { color: var(--dim); display: block; font-size: 11.5px; margin-top: 3px; }
.prose { color: #d5dae6; font-size: 13px; overflow-wrap: anywhere; }
.prose code, .tl code { font: 12px var(--mono); background: rgba(255, 255, 255, .08); padding: 1px 5px; border-radius: 5px; }
ul.plain { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
ul.plain li { padding-left: 14px; position: relative; font-size: 13px; color: #d5dae6; overflow-wrap: anywhere; }
ul.plain li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--c); }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kv div { background: var(--glass-2); border-radius: 10px; padding: 8px 10px; }
.kv span { display: block; color: var(--dim); font-size: 11px; }
.kv b { font-size: 13px; font-weight: 600; }
.ticket { display: grid; grid-template-columns: auto 1fr; gap: 2px 9px; padding: 8px 10px; border-radius: 10px; background: var(--glass-2); text-decoration: none; color: inherit; }
.ticket:hover { background: rgba(255, 255, 255, .09); }
.ticket b { font: 600 12px var(--mono); color: var(--accent); }
.ticket i { font-style: normal; color: var(--dim); font-size: 11.5px; justify-self: end; }
.ticket span { grid-column: 1 / -1; font-size: 12.5px; }
.muted { color: var(--dim); font-size: 12.5px; }
.tl { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.tl li { display: grid; grid-template-columns: 46px 1fr; gap: 8px; font-size: 12.5px; }
.tl time { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; padding-top: 2px; }
.tl .tool { color: var(--muted); }
.tl .say { color: #dfe4ef; white-space: pre-wrap; overflow-wrap: anywhere; }
.tl .inbox { color: #fff; background: rgba(124, 156, 255, .14); border-radius: 10px; padding: 6px 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
pre.term { margin: 0; background: #07090f; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 11px/1.45 var(--mono); color: #c9d4e6; overflow: auto; flex: 1; min-height: 240px; white-space: pre; }
.composer { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 3px 10px; font-size: 12px; color: var(--muted); }
.chips button:hover { color: var(--text); border-color: var(--c); }
.chips .danger { margin-left: auto; color: var(--blocked); border-color: rgba(251, 113, 133, .35); }
.row { display: flex; gap: 8px; align-items: flex-end; }
textarea { flex: 1; resize: none; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; min-height: 42px; max-height: 140px; outline: none; }
textarea:focus, #cmd input:focus { border-color: var(--accent); }
.send { border: 0; background: var(--c, var(--accent)); color: #fff; font-weight: 600; border-radius: 12px; padding: 0 16px; height: 42px; }
.send:disabled { opacity: .5; cursor: default; }

/* command bar */
#cmd { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(560px, calc(100vw - 720px)); min-width: 320px; display: flex; gap: 6px; padding: 5px; z-index: 5; }
#cmd input { flex: 1; background: transparent; border: 1px solid transparent; border-radius: var(--r-s); padding: 6px 10px; outline: none; min-width: 0; }
#cmd input::placeholder { color: var(--dim); }
#cmd .send { height: 32px; padding: 0 14px; border-radius: var(--r-s); background: var(--accent); color: var(--on-accent); }
#cmd .hint { position: absolute; left: 6px; bottom: calc(100% + 6px); font-size: 12px; color: var(--muted); background: var(--glass); padding: 4px 10px; border-radius: var(--r-s); border: 1px solid var(--line); display: none; }
#cmd .hint.show { display: block; }
body.panel-open #cmd { left: calc((100vw - var(--panel-w)) / 2); width: min(560px, calc(100vw - var(--panel-w) - 300px)); }

/* toasts + banner */
#toasts { position: fixed; top: calc(var(--bar) + 12px); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; align-items: center; z-index: 9; pointer-events: none; }
.toast { padding: 9px 14px; display: flex; gap: 9px; align-items: center; font-size: 13px; animation: drop .3s ease-out; pointer-events: auto; }
.toast.err { border-color: rgba(251, 113, 133, .5); }
@keyframes drop { from { opacity: 0; transform: translateY(-10px); } }
#banner { position: fixed; top: calc(var(--bar) + 12px); left: 50%; transform: translateX(-50%); padding: 9px 16px; z-index: 8; color: #fecdd3; display: none; }
#banner.show { display: block; }

/* in-world labels */
.tag { display: flex; flex-direction: column; align-items: center; gap: 5px; pointer-events: none; transition: opacity .3s; }
.tag .chip { pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 99px; background: #0d0f18; border: 1px solid rgba(255, 255, 255, .12); font-size: 12px; white-space: nowrap; }
.tag .chip b { font-weight: 600; }
.tag .chip span { color: var(--muted); font-size: 11px; }
.tag .doing { max-width: 210px; padding: 3px 9px; border-radius: 8px; background: #0d3a2b; border: 1px solid #2fbf8a; color: #fff; font-weight: 500; font-size: 11.5px; box-shadow: 0 4px 14px rgba(0, 0, 0, .45); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: none; }
.tag.hot[data-status=working] .doing:not(:empty) { display: block; } /* only for the person you point at */
.tag.hot[data-status=blocked] .doing:not(:empty) { display: block; background: #45330a; border-color: var(--needs); color: #fff; }
.tag[data-status=offline] { opacity: .55; }
.tag .bubble { max-width: 320px; padding: 10px 13px; border-radius: 14px 14px 14px 4px; background: #fff; color: #171a24; font-size: 14.5px; font-weight: 500; line-height: 1.35; box-shadow: 0 8px 24px rgba(0, 0, 0, .35); display: none; overflow-wrap: anywhere; }
.tag .bubble.show { display: block; animation: pop .25s cubic-bezier(.3, 1.6, .5, 1); }
.tag .bubble.you { background: #7c9cff; color: #fff; }
.tag .bubble small { display: block; font-weight: 700; font-size: 11.5px; opacity: .65; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }

body.embed .top, body.embed #roster, body.embed #feed, body.embed #panel, body.embed #cmd, body.embed #toasts, body.embed #banner { display: none !important; }
body.embed .tag .chip { font-size: 14px; padding: 4px 12px 4px 9px; }
body.embed .tag .doing { font-size: 14px; max-width: 250px; padding: 4px 11px; }
body.embed .tag .bubble { font-size: 19px; max-width: 420px; padding: 13px 17px; }
body.embed .tag .bubble small { font-size: 12.5px; }

/* what each person needs from you, at the top of their panel */
#asks { display: none; flex-direction: column; gap: 8px; padding: 12px 14px; max-height: 46%; overflow: auto; border-bottom: 1px solid var(--line); flex: none; }
#asks.show { display: flex; }
.ask { padding: 10px 12px; border-radius: 8px; background: color-mix(in srgb, var(--needs) 9%, transparent); border: 1px solid color-mix(in srgb, var(--needs) 38%, transparent); }
.ask.note { background: var(--glass-2); border-color: var(--line); }
.ask .ahead { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); }
.ask .ahead b { color: var(--needs); font-weight: 600; } .ask.note .ahead b { color: var(--muted); }
.ask .ahead a { margin-left: auto; }
.ask .atitle { margin-top: 5px; font-size: 14px; line-height: 1.38; overflow-wrap: anywhere; }
.ask .abody { margin-top: 5px; color: var(--muted); font-size: 12.5px; line-height: 1.45; overflow-wrap: anywhere; }
.ask .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ask button { border: 1px solid var(--line); background: var(--glass-2); border-radius: var(--r-s); padding: 4px 10px; font-size: 12.5px; text-align: left; }
.ask button:hover { border-color: var(--muted); }
.ask button.pri { background: var(--text); color: var(--panel); border-color: var(--text); font-weight: 600; }
.ask input { flex: 1; min-width: 0; background: rgba(0, 0, 0, .3); border: 1px solid var(--line); border-radius: var(--r-s); padding: 4px 9px; font-size: 12.5px; outline: none; }
.ask input:focus { border-color: var(--accent); }
button.stat.need { border: 0; background: color-mix(in srgb, var(--needs) 16%, transparent); border-radius: 99px; padding: 0 9px; color: var(--needs); font-weight: 600; pointer-events: auto; }
button.stat.need b { color: var(--needs); }
button.stat.need:hover { background: color-mix(in srgb, var(--needs) 26%, transparent); }
/* one line after you come back */
#recap { position: fixed; top: calc(var(--bar) + 12px); left: 50%; transform: translate(-50%, -8px); max-width: min(760px, calc(100vw - 24px)); z-index: 8; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 2px 8px;
  padding: 8px 14px; border: 1px solid var(--line); border-radius: var(--r); background: var(--glass); box-shadow: var(--shadow); color: var(--text); font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .5s, transform .5s; }
#recap.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
#recap span { color: var(--dim); } #recap i { font-style: normal; color: var(--dim); }
#scene::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, transparent 58%, rgba(0, 0, 0, .26) 100%); }
html body #requests { right: 12px; border-radius: var(--r); background: var(--glass); backdrop-filter: none; box-shadow: var(--shadow); }
html body #requests h3 { font-size: 12px; letter-spacing: 0; text-transform: none; }
html body #requests, html body.panel-open #requests, html body.clients-open #requests { top: calc(var(--bar) + 12px); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

@media (max-width: 1100px) {
  .top { gap: 14px; }
  #roster { width: 240px; } #roster .last { display: none; }
  #feed { bottom: 62px; width: 300px; max-height: 34vh; }
  #cmd { width: min(600px, calc(100vw - 24px)); left: 50% !important; }
  #panel, #clients { width: min(410px, calc(100vw - 24px)); bottom: 62px; }
  html body.panel-open #requests, html body.clients-open #requests { display: none; }
}
@media (max-width: 860px) { .brand small { display: none; } }
@media (max-width: 700px) {
  .stats { display: none; }
  #roster { flex-direction: row; width: auto; right: 12px; overflow-x: auto; }
  #roster .card { min-width: 190px; } #roster .card + .card { border-top: 0; border-left: 1px solid var(--line); }
}
</style>
</head>

  <div class="stats" id="stats"></div>

  </div>
